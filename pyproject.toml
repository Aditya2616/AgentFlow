[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "A plan, act, verify agent loop with five tools, a structured trace and a live graph UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Jain" }]
dependencies = [
  "langchain>=1.2,<2",
  "langchain-core>=1.2,<2",
  "langgraph>=1.1,<2",
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
]

[project.optional-dependencies]
local = ["torch>=2.3", "transformers>=4.50"]
hybrid = ["sentence-transformers>=3"]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.45"]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentflow = ["data/corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a downloaded model or a browser"]
addopts = "-m 'not slow' -q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
